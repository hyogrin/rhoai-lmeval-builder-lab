apiVersion: trustyai.opendatahub.io/v1alpha1
kind: LMEvalJob
metadata:
  name: eval-custom-click             # <CHANGE_ME>
spec:
  allowOnline: true
  model: local-completions

  modelArgs:
    - name: base_url
      value: "https://<MODEL_NAME>-predictor.<NAMESPACE>.svc.cluster.local:8443/v1/completions"  # <CHANGE_ME>
    - name: model
      value: "<MODEL_NAME>"           # <CHANGE_ME> InferenceService name
    - name: tokenizer
      value: "google/gemma-2b"        # <CHANGE_ME> HF tokenizer ID
    - name: verify_certificate
      value: "False"
    - name: num_concurrent
      value: "1"
    - name: max_retries
      value: "3"
    - name: tokenized_requests
      value: "false"

  taskList:
    customTasks:
      source:
        git:
          url: https://github.com/EleutherAI/lm-evaluation-harness.git
          branch: main
          path: lm_eval/tasks/click   # CLIcK task group
    taskNames:
      - click                         # All 11 CLIcK categories
      # Individual categories:
      # - click_lang_text
      # - click_lang_grammar
      # - click_lang_function
      # - click_cul_society
      # - click_cul_tradition
      # - click_cul_politics
      # - click_cul_economy
      # - click_cul_law
      # - click_cul_history
      # - click_cul_geography
      # - click_cul_kpop

  logSamples: true
  limit: "5"                          # Remove or increase for full evaluation

  pod:
    container:
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: lmeval-sa-token
              key: token
